name: validate

# Validates every skill's manifest against the marketplace publishing contract, plus the repo's own
# build checks (build/SkillLint.psm1: import scan, tool names, schema subset, folder rule, vendor lock,
# zip mirror). This is validation the skills never had while they lived in the main sophon repo.
# Also runs the skill lint's own tests, the generated-file check of the vendored ffmpeg-video skill and
# every offline skill test (tests/skills/run_all.py).
# Also checks the agents' sources (agents/, build/agent-src/), every family in
# build/agent-src/families.psd1: SOUL drift, tool-name lint, scanner preflight, budgets, manifests and
# TOOLS.md. The Sophon CLI checks (sophon dev validate and the package build) are not run here;
# maintainers run them locally before publishing. ffmpeg-video's own jobs are in ffmpeg-video.yml.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'build/**'
      - 'build/agent-src/**'
      - 'agents/**'
      - 'tests/agents/**'
      - 'tests/skills/**'
      - 'tests/build/**'
      - 'templates/**'
      - 'LICENSE'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'build/**'
      - 'build/agent-src/**'
      - 'agents/**'
      - 'tests/agents/**'
      - 'tests/skills/**'
      - 'tests/build/**'
      - 'templates/**'
      - 'LICENSE'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skill manifests and build checks
        shell: pwsh
        run: pwsh -File build/Build-MarketplacePackages.ps1 -ValidateOnly
      # Every later step runs even when an earlier one failed, so each check reports on its own; the
      # job still fails.
      - name: Check ffmpeg-video generated files (generate.py --check)
        if: ${{ !cancelled() }}
        run: python -B build/ffmpeg-video/generate.py --check
      - name: Test the skill build checks (Test-SkillLint.ps1)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: pwsh -NoProfile -File tests/build/Test-SkillLint.ps1
      - name: Run the offline skill tests (run_all.py)
        if: ${{ !cancelled() }}
        run: python tests/skills/run_all.py
      - name: Check agent sources (SOUL drift, lint, preflight, manifests)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File build/Compose-AgentSouls.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File build/Test-AgentSources.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
