name: validate

# Validates every skill's manifest against the marketplace publishing contract.
# This is validation the skills never had while they lived in the main sophon repo.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'build/**'
      - 'templates/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'build/**'
      - 'templates/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill manifests
        shell: pwsh
        run: pwsh -File build/Build-MarketplacePackages.ps1 -ValidateOnly
