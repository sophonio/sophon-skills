name: validate

# Validates every skill's manifest against the marketplace publishing contract, plus the repo's own
# build checks (build/SkillLint.psm1: import scan, tool names, schema subset, folder rule, vendor lock,
# zip mirror). This is validation the skills never had while they lived in the main sophon repo.
# Also runs the skill lint's own tests, the generated-file checks of the vendored ffmpeg-video skill and of
# craft-reference (plus its topic source checks), and every offline skill test (tests/skills/run_all.py).
# Also checks the agents' sources (agents/, build/agent-src/), every family in
# build/agent-src/families.psd1: SOUL drift, tool-name lint, scanner preflight, budgets, manifests and
# TOOLS.md, and the roster counts the documents state (DOC-COUNT). The Sophon CLI checks (sophon dev
# validate and the package build) are not run here; maintainers run them locally before publishing. The last step lints the instruction-test scenarios
# (tests/agents/evals/Invoke-AgentEvals.ps1 -ValidateOnly), which needs no CLI and no Gateway. ffmpeg-video's own jobs are in ffmpeg-video.yml.
# From milestone M9 of the agents v3 design on, the agent source checks, the scenario lint and the craft-reference
# generator run with their release switch (-Release, --release), so every change is checked as a release.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'build/**'
      - 'build/agent-src/**'
      - 'agents/**'
      - 'tests/agents/**'
      - 'tests/skills/**'
      - 'tests/build/**'
      - 'templates/**'
      - 'LICENSE'
      # The documents DOC-COUNT reads (build/agent-src/catalog/doc-counts.psd1); tests/agents/evals/ and
      # build/agent-src/readmes/ are covered above.
      - 'README.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'docs/AGENTS.md'
      - 'docs/PUBLISHING.md'
      - 'tests/README.md'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'build/**'
      - 'build/agent-src/**'
      - 'agents/**'
      - 'tests/agents/**'
      - 'tests/skills/**'
      - 'tests/build/**'
      - 'templates/**'
      - 'LICENSE'
      # The documents DOC-COUNT reads (build/agent-src/catalog/doc-counts.psd1); tests/agents/evals/ and
      # build/agent-src/readmes/ are covered above.
      - 'README.md'
      - 'CLAUDE.md'
      - 'CONTRIBUTING.md'
      - 'docs/AGENTS.md'
      - 'docs/PUBLISHING.md'
      - 'tests/README.md'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate skill manifests and build checks
        shell: pwsh
        run: pwsh -File build/Build-MarketplacePackages.ps1 -ValidateOnly
      # Every later step runs even when an earlier one failed, so each check reports on its own; the
      # job still fails.
      - name: Check ffmpeg-video generated files (generate.py --check)
        if: ${{ !cancelled() }}
        run: python -B build/ffmpeg-video/generate.py --check
      - name: Check craft-reference generated files (generate.py --check --release)
        if: ${{ !cancelled() }}
        run: python -B build/craft-reference/generate.py --check --release
      - name: Check craft-reference topic sources (Test-CraftSources.ps1)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: pwsh -NoProfile -File build/craft-reference/Test-CraftSources.ps1
      - name: Test the skill build checks (Test-SkillLint.ps1)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: pwsh -NoProfile -File tests/build/Test-SkillLint.ps1
      - name: Run the offline skill tests (run_all.py)
        if: ${{ !cancelled() }}
        run: python tests/skills/run_all.py
      - name: Check agent sources (SOUL drift, lint, preflight, manifests)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File build/Compose-AgentSouls.ps1 -Check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File build/Test-AgentSources.ps1 -Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Lint the instruction-test scenarios (Invoke-AgentEvals.ps1 -ValidateOnly -Release)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: pwsh -NoProfile -File tests/agents/evals/Invoke-AgentEvals.ps1 -ValidateOnly -Release
